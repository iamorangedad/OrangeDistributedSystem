[package]
name = "orange"
version = "0.1.0"
edition = "2021"
description = "Orange order system, Rust implementation of the same design as the Python package."

[[bin]]
name = "orange"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
