<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">OrangeOrder 进程架构</title>
  <desc id="desc">调用方经网关访问订单副本，订单写入唯一主存储，从存储异步复制。推荐可失败，工人向主存储领取任务，监督者位于控制面。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#222222"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    text { font-family: sans-serif; }
  </style>
  <rect width="980" height="420" fill="#ffffff"/>
  <g>
    <rect x="28" y="56" width="132" height="72" rx="6" fill="#f6f6f4" stroke="#222222"/>
    <text x="94" y="88" text-anchor="middle" font-size="15" fill="#1a1a1a">调用方</text>
    <text x="94" y="108" text-anchor="middle" font-size="12" fill="#666666">另一个项目</text>
  </g>
  <g>
    <rect x="230" y="56" width="132" height="72" rx="6" fill="#f6f6f4" stroke="#222222"/>
    <text x="296" y="88" text-anchor="middle" font-size="15" fill="#1a1a1a">网关</text>
    <text x="296" y="108" text-anchor="middle" font-size="12" fill="#666666">:8080</text>
  </g>
  <g>
    <rect x="432" y="36" width="140" height="52" rx="6" fill="#f6f6f4" stroke="#222222"/>
    <text x="502" y="58" text-anchor="middle" font-size="15" fill="#1a1a1a">订单 A</text>
    <text x="502" y="76" text-anchor="middle" font-size="12" fill="#666666">:8101</text>
    <rect x="432" y="100" width="140" height="52" rx="6" fill="#f6f6f4" stroke="#222222"/>
    <text x="502" y="122" text-anchor="middle" font-size="15" fill="#1a1a1a">订单 B</text>
    <text x="502" y="140" text-anchor="middle" font-size="12" fill="#666666">:8102</text>
  </g>
  <g>
    <rect x="648" y="56" width="140" height="72" rx="6" fill="#fff6f0" stroke="#c4550a" stroke-width="2"/>
    <text x="718" y="88" text-anchor="middle" font-size="15" fill="#1a1a1a">主存储</text>
    <text x="718" y="108" text-anchor="middle" font-size="12" fill="#666666">:8301 唯一写入</text>
  </g>
  <g>
    <rect x="832" y="56" width="124" height="72" rx="6" fill="#f6f6f4" stroke="#222222"/>
    <text x="894" y="88" text-anchor="middle" font-size="15" fill="#1a1a1a">从存储</text>
    <text x="894" y="108" text-anchor="middle" font-size="12" fill="#666666">:8302</text>
  </g>
  <line x1="160" y1="92" x2="226" y2="92" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="362" y1="78" x2="428" y2="62" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="362" y1="106" x2="428" y2="126" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="572" y1="62" x2="644" y2="80" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="572" y1="126" x2="644" y2="104" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="788" y1="92" x2="828" y2="92" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="432" y="196" width="140" height="52" rx="6" fill="#f6f6f4" stroke="#666666" stroke-dasharray="5 3"/>
    <text x="502" y="218" text-anchor="middle" font-size="15" fill="#1a1a1a">推荐</text>
    <text x="502" y="236" text-anchor="middle" font-size="12" fill="#666666">:8200 可失败</text>
  </g>
  <g>
    <rect x="648" y="196" width="140" height="52" rx="6" fill="#f6f6f4" stroke="#666666" stroke-dasharray="5 3"/>
    <text x="718" y="218" text-anchor="middle" font-size="15" fill="#1a1a1a">工人 ×1–3</text>
    <text x="718" y="236" text-anchor="middle" font-size="12" fill="#666666">领取任务</text>
  </g>
  <line x1="502" y1="152" x2="502" y2="192" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-muted)"/>
  <line x1="718" y1="196" x2="718" y2="132" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-muted)"/>
  <text x="188" y="80" font-size="11" fill="#666666">/v1</text>
  <text x="600" y="54" font-size="11" fill="#666666">同一事务</text>
  <text x="796" y="84" font-size="11" fill="#666666">异步</text>
  <text x="508" y="180" font-size="11" fill="#666666">80ms</text>
  <rect x="28" y="292" width="928" height="56" rx="6" fill="#f6f6f4" stroke="#222222"/>
  <text x="492" y="316" text-anchor="middle" font-size="15" fill="#1a1a1a">监督者 :8090</text>
  <text x="492" y="336" text-anchor="middle" font-size="12" fill="#666666">探活、拉起进程、公布当前主节点、按任务积压加减工人。不在写入确认路径上。</text>
  <text x="28" y="380" font-size="12" fill="#1a1a1a">实线：必须成功的写路径</text>
  <text x="230" y="380" font-size="12" fill="#666666">虚线：可降级旁路或工人领取</text>
  <text x="470" y="380" font-size="12" fill="#c4550a">橙色边框：唯一写入者</text>
  <text x="28" y="402" font-size="12" fill="#666666">部署：一台机器上的多个进程。订单副本固定两个；弹性体现在工人数量。</text>
</svg>
