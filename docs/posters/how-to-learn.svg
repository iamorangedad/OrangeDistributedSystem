<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1680" width="880" height="1680" role="img">
  <title>怎样读这套代码</title>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e4e0d6" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.4 L 9 5 L 0 8.6 z" fill="#222222"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.4 L 9 5 L 0 8.6 z" fill="#777777"/>
    </marker>
  </defs>
  <rect width="880" height="1680" fill="#f6f3ec"/>
  <rect width="880" height="1680" fill="url(#grid)"/>
  <rect x="28" y="28" width="46" height="56" rx="6" fill="#2f6fd6"/>
  <rect x="36" y="36" width="30" height="36" rx="2" fill="#ffffff"/>
  <text x="51" y="60" font-size="18" fill="#2f6fd6" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">O</text>
  <rect x="86" y="32" width="92" height="26" rx="6" fill="#1c1c1c"/>
  <text x="132" y="50" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">阅读</text>
  <text x="188" y="50" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Orange 学习海报</text>
  <text x="40" y="122" font-size="36" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">怎样读这套代码</text>
  <rect x="28" y="142" width="824" height="48" rx="8" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.6"/>
  <rect x="28" y="142" width="8" height="48" fill="#2f6fd6"/>
  <text x="52" y="172" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="500" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">先看一笔请求如何变成订单，再看它依赖的存储、工人和监督者。</text>
  <text x="40" y="230" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">01</text>
<text x="108" y="230" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">从一笔订单的诞生读起</text>
<text x="108" y="256" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">文件是 python/src/orange/order_service.py，先读这三个函数。</text>
<rect x="40" y="300" width="800" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<circle cx="72" cy="342" r="16" fill="#e07a2f"/>
<text x="72" y="347" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">1</text>
<text x="104" y="334" font-size="16" fill="#2f6fd6" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">create_order</text>
<text x="104" y="360" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">检查调用方、幂等键和 800ms 截止时间。过了截止时间就 504，不再访问存储。</text>
<rect x="40" y="396" width="800" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<circle cx="72" cy="438" r="16" fill="#e07a2f"/>
<text x="72" y="443" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">2</text>
<text x="104" y="430" font-size="16" fill="#2f6fd6" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">lookup_existing</text>
<text x="104" y="456" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">用调用方加钥匙向主存储查询。正文相同返回当前快照；正文不同返回 409。</text>
<rect x="40" y="492" width="800" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<circle cx="72" cy="534" r="16" fill="#e07a2f"/>
<text x="72" y="539" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">3</text>
<text x="104" y="526" font-size="16" fill="#2f6fd6" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">write_new</text>
<text x="104" y="552" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">写主存储和询问推荐同时开始。推荐最多等 80ms，赶不上则 degraded 为 true。</text>
<line x1="64" y1="600" x2="64" y2="628" stroke="#e07a2f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="690" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">02</text>
<text x="108" y="690" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">顺着调用往下看</text>
<text x="108" y="716" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">推荐文件很短。先弄清它为什么被调用，再打开它。</text>
<rect x="40" y="760" width="396" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="58" y="792" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/src/orange/common.py</text>
<text x="58" y="818" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">正文如何收成可比对的字符串；推荐熔断如何打开。</text>
<rect x="452" y="760" width="396" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="470" y="792" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/src/orange/gateway.py</text>
<text x="470" y="818" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">令牌、积压和在途如何在唯一入口被拒绝。</text>
<rect x="40" y="856" width="396" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="58" y="888" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/src/orange/store.py</text>
<text x="58" y="914" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">订单、任务和复制日志如何在一次提交里落盘。</text>
<rect x="452" y="856" width="396" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="470" y="888" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/src/orange/worker.py</text>
<text x="470" y="914" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">任务如何被领取、重试，以及如何进入死信。</text>
<rect x="40" y="952" width="396" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="58" y="984" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/src/orange/supervisor.py</text>
<text x="58" y="1010" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">进程如何被拉起，主存储如何被提升，工人如何加减。</text>
<rect x="452" y="952" width="396" height="84" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="470" y="984" font-size="15" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/src/orange/recommender.py</text>
<text x="470" y="1010" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">按商品编号返回一句固定文案，没有训练或推理。</text>
<line x1="64" y1="1060" x2="64" y2="1088" stroke="#e07a2f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1120" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">03</text>
<text x="108" y="1120" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">文档按问题选</text>
<text x="108" y="1146" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">设计文档仍是行为依据。代码和验收测试已经落地。</text>
<rect x="40" y="1188" width="194" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="137" y="1224" font-size="16" fill="#c4550a" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">要接入</text>
<text x="56" y="1254" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">集成指南，</text>
<text x="56" y="1274" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">再看 OpenAPI</text>
<rect x="246" y="1188" width="194" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="343" y="1224" font-size="16" fill="#c4550a" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">要看结构</text>
<text x="262" y="1254" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">架构设计里的</text>
<text x="262" y="1274" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">路径和状态机</text>
<rect x="452" y="1188" width="194" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="549" y="1224" font-size="16" fill="#c4550a" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">要对着实现</text>
<text x="468" y="1254" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">技术方案的参数表</text>
<text x="468" y="1274" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">再看数据模型和接口</text>
<rect x="658" y="1188" width="194" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="755" y="1224" font-size="16" fill="#c4550a" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">要问为什么</text>
<text x="674" y="1254" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">五篇 ADR，以及</text>
<text x="674" y="1274" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">需求与变更记录</text>
<line x1="64" y1="1324" x2="64" y2="1352" stroke="#e07a2f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1364" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">04</text>
<text x="108" y="1364" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">在这台机器上确认</text>
<text x="108" y="1390" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">网关只监听本机。测试也在这台机器上做。</text>
<circle cx="56" cy="1405" r="11" fill="#e07a2f"/>
<text x="56" y="1409" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">1</text>
<text x="80" y="1410" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">启动</text>
<text x="150" y="1410" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/run.sh --root .</text>
<circle cx="56" cy="1437" r="11" fill="#e07a2f"/>
<text x="56" y="1441" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">2</text>
<text x="80" y="1442" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">下一单</text>
<text x="150" y="1442" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">只向 127.0.0.1:8080 发送 POST /v1/orders</text>
<circle cx="56" cy="1469" r="11" fill="#e07a2f"/>
<text x="56" y="1473" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">3</text>
<text x="80" y="1474" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">注入故障</text>
<text x="150" y="1474" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">改 runtime/faults.json，约 200ms 后生效</text>
<circle cx="56" cy="1501" r="11" fill="#e07a2f"/>
<text x="56" y="1505" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">4</text>
<text x="80" y="1506" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">看状态</text>
<text x="150" y="1506" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">监督者的 /v1/status，以及 runtime/logs</text>
<circle cx="56" cy="1533" r="11" fill="#e07a2f"/>
<text x="56" y="1537" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">5</text>
<text x="80" y="1538" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">回归</text>
<text x="150" y="1538" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">python/run.sh test</text>
  <rect x="28" y="1588" width="824" height="64" rx="10" fill="#e07a2f"/>
  <text x="440" y="1626" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">没有模型训练。推荐是一句按商品编号返回的固定文案。</text>
</svg>
