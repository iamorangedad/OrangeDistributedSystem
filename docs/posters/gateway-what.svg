<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" width="880" height="1280" role="img">
  <title>网关是门口</title>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e4e0d6" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.4 L 9 5 L 0 8.6 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="880" height="1280" fill="#f6f3ec"/>
  <rect width="880" height="1280" fill="url(#grid)"/>
  <rect x="28" y="28" width="46" height="56" rx="6" fill="#2f6fd6"/>
  <rect x="36" y="36" width="30" height="36" rx="2" fill="#ffffff"/>
  <text x="51" y="60" font-size="18" fill="#2f6fd6" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">O</text>
  <rect x="86" y="32" width="92" height="26" rx="6" fill="#1c1c1c"/>
  <text x="132" y="50" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">网关</text>
  <text x="188" y="50" font-size="13" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">通用概念</text>
  <text x="40" y="122" font-size="34" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">网关是门口</text>
  <rect x="28" y="142" width="824" height="48" rx="8" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.6"/>
  <rect x="28" y="142" width="8" height="48" fill="#2f6fd6"/>
  <text x="52" y="172" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">调用方和后面的许多服务之间，有一层统一的入口。</text>
  <text x="40" y="220" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">01</text>
<text x="108" y="220" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">调用方只认一个地址</text>
<text x="108" y="246" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">后面的服务可以增加、替换，调用方不用跟着改。</text>
<rect x="40" y="290" width="400" height="210" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="240" y="328" font-size="20" fill="#1c1c1c" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">没有这一层</text>
<text x="68" y="378" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">每个服务各有一个地址</text>
<text x="68" y="414" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">服务一换，调用方就要改</text>
<text x="68" y="450" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">限流和超时散落在各处</text>
<rect x="460" y="290" width="400" height="210" rx="8" fill="#fff6f0" stroke="#c4550a" stroke-width="2"/>
<text x="660" y="328" font-size="20" fill="#c4550a" text-anchor="middle" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">有网关</text>
<text x="488" y="378" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">对外只有一个入口</text>
<text x="488" y="414" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">副本更换留在门口里面</text>
<text x="488" y="450" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">保护规则集中在这一层</text>
<text x="40" y="540" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">02</text>
<text x="108" y="540" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">它站在请求的路径上</text>
<text x="108" y="566" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">业务进程在它后面。调用方到不了那些内部地址。</text>
<rect x="40" y="640" width="150" height="72" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="115.0" y="680" font-size="16" fill="#1c1c1c" text-anchor="middle" font-weight="650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">调用方</text>
<text x="115.0" y="700" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">浏览器或另一个系统</text>
<rect x="270" y="640" width="170" height="72" rx="8" fill="#fff6f0" stroke="#c4550a" stroke-width="2.2"/>
<text x="355.0" y="680" font-size="16" fill="#1c1c1c" text-anchor="middle" font-weight="650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">网关</text>
<text x="355.0" y="700" font-size="12" fill="#5c5c5c" text-anchor="middle" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">唯一对外地址</text>
<rect x="540" y="560" width="280" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="680.0" y="594" font-size="16" fill="#1c1c1c" text-anchor="middle" font-weight="650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">服务 A</text>
<rect x="540" y="640" width="280" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="680.0" y="674" font-size="16" fill="#1c1c1c" text-anchor="middle" font-weight="650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">服务 B</text>
<rect x="540" y="720" width="280" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="680.0" y="754" font-size="16" fill="#1c1c1c" text-anchor="middle" font-weight="650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">服务 C</text>
<line x1="190" y1="676" x2="266" y2="676" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440" y1="660" x2="536" y2="588" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440" y1="676" x2="536" y2="668" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440" y1="692" x2="536" y2="748" stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="40" y="840" font-size="28" fill="#e07a2f" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">03</text>
<text x="108" y="840" font-size="24" fill="#1c1c1c" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">业务留在后面</text>
<text x="108" y="866" font-size="14" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">网关决定这次请求能不能进、交给谁。服务决定业务结果。</text>
<rect x="40" y="910" width="800" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="60" y="948" font-size="16" fill="#c4550a" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">门口</text>
<text x="160" y="948" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">收请求、选目的地、在过载时拒绝</text>
<rect x="40" y="982" width="800" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="60" y="1020" font-size="16" fill="#c4550a" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">服务</text>
<text x="160" y="1020" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">完成下单、查询、扣库存这些业务</text>
<rect x="40" y="1054" width="800" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="60" y="1092" font-size="16" fill="#c4550a" text-anchor="start" font-weight="700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">调用方</text>
<text x="160" y="1092" font-size="16" fill="#1c1c1c" text-anchor="start" font-weight="400" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">只保存网关地址，不保存每个副本的地址</text>
  <rect x="28" y="1188" width="824" height="64" rx="10" fill="#e07a2f"/>
  <text x="440" y="1226" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">Nginx、Envoy、API 网关，站的都是这一层</text>
</svg>
